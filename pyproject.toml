[project]
name = "bb-clinical-evidence-agent"
version = "0.1.0"
description = "Auditable clinical record abstraction with bounded agent investigation"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.68",
  "openai>=1.70",
  "pydantic>=2.8",
]

[project.optional-dependencies]
web = ["gradio>=6.0,<7"]

[project.scripts]
bb-review = "bb.cli:main"
bb-review-web = "bb.web:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bb"]
